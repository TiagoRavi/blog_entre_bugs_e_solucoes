
{% load static %}
{% load i18n %}

<form
  class="nav-search"
  action="{% url 'blog:post_list' %}"
  method="get"
  role="search"
>
  <div class="search-wrapper" id="search-wrapper">

    <input
      type="search"
      name="q"
      id="search-input"
      class="search-input"
      placeholder="{% translate 'Buscar artigos...' %}"
      value="{{ request.GET.q }}"
      autocomplete="off"
      aria-label="{% translate 'Buscar artigos no blog' %}"
    >

    <button
      type="button"
      id="search-toggle"
      class="search-toggle"
      aria-label="{% translate 'Abrir pesquisa' %}"
      aria-controls="search-input"
    >
      <img
        src="{% static 'img/svg/search_icon.svg' %}"
        alt=""
        width="18"
        height="18"
      >
    </button>

    <button
      type="submit"
      class="search-submit"
      aria-label="{% translate 'Pesquisar' %}"
    >
      {% translate "Buscar" %}
    </button>

  </div>
</form>
