{% load static %}

<form
    class="nav-search"
    action="{% url 'blog:post_list' %}"
    method="get"
    role="search"
>
    <div class="search-wrapper" id="search-wrapper">

        <input
            type="search"
            name="q"
            id="search-input"
            class="search-input"
            placeholder="Buscar artigos..."
            value="{{ request.GET.q }}"
            autocomplete="off"
            aria-label="Buscar artigos no blog"
        >

        <button
            type="button"
            id="search-toggle"
            class="search-toggle"
            aria-label="Abrir pesquisa"
            aria-controls="search-input"
        >
            <img
                src="{% static 'img/svg/search_icon.svg' %}"
                alt=""
                width="18"
                height="18"
            >
        </button>

        <button
            type="submit"
            class="search-submit"
            aria-label="Pesquisar"
        >
            Buscar
        </button>

    </div>
</form>
