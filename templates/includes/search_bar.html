{% load static %}

<form
  class="nav-search"
  action="{% url 'blog:post_list' %}"
  method="get"
  role="search"
>
  <div class="search-wrapper" id="search-wrapper">
    <input
      type="search"
      name="q"
      id="search-input"
      placeholder="Digite aqui o que você procura no blog"
      value="{{ request.GET.q }}"
      aria-label="Buscar no blog"
      class="search-input"
    >

    <button
      type="button"
      class="search-toggle"
      id="search-toggle"
      aria-label="Abrir busca"
    >
      <img
        src="{% static 'img/svg/search_icon.svg' %}"
        alt=""
        width="18"
        height="18"
      >
    </button>

    <button
      type="submit"
      class="search-submit"
      aria-label="Buscar"
    >
      Buscar
    </button>
  </div>
</form>
