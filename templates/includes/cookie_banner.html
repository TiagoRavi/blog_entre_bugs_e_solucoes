
<!-- ==================================================
     Cookie Banner (LGPD)
     - Aviso de uso de cookies
     - Consentimento explícito
     - Reversível via botão flutuante
================================================== -->
<div
  id="cookie-banner"
  class="cookie-banner is-hidden"
  role="dialog"
  aria-label="Aviso de cookies"
  aria-live="polite"
>
  <div class="cookie-banner__content">

    <p class="cookie-banner__text">
      Utilizamos cookies e tecnologias semelhantes para o funcionamento
      do site, análise de tráfego e, quando aplicável, publicidade.
      Você pode aceitar ou recusar cookies não essenciais.
      Consulte nossa
      <a href="{% url 'pages:privacy' %}">
        Política de Privacidade
      </a>
      para saber mais sobre o uso de cookies e suas preferências.
    </p>

    <div class="cookie-banner__actions">
      <button
        id="cookie-accept"
        class="cookie-btn cookie-btn--accept"
        type="button"
      >
        Aceitar
      </button>

      <button
        id="cookie-decline"
        class="cookie-btn cookie-btn--decline"
        type="button"
      >
        Recusar
      </button>
    </div>

  </div>
</div>
