
{% load static %}
{% load i18n %}

<section class="hero-full">

  <picture>
    <!-- DESKTOP GRANDE -->
    <source
      media="(min-width: 1441px)"
      srcset="{% static 'img/hero/hero-desktop.webp' %}"
    >

    <!-- NOTEBOOK -->
    <source
      media="(min-width: 1025px)"
      srcset="{% static 'img/hero/hero-notebook.webp' %}"
    >

    <!-- TABLET -->
    <source
      media="(min-width: 641px)"
      srcset="{% static 'img/hero/hero-notebook.webp' %}"
    >

    <!-- MOBILE -->
    <img
      src="{% static 'img/hero/hero-mobile.webp' %}"
      alt="{% translate 'Entre Bugs e Soluções - Programação prática e soluções reais' %}"
      class="hero-image"
      loading="eager"
      decoding="async"
    >
  </picture>

  <div class="hero-overlay"></div>

  <!-- CONTEÚDO DO HERO -->
  <div class="hero-content">
    <div class="hero-brand">
      <span class="hero-code">&lt;/&gt;</span>
      <span class="hero-brand-text">
        {% translate "ENTRE BUGS" %}<br>
        {% translate "E SOLUÇÕES" %}
      </span>
    </div>

    <h1 class="hero-title">
      {% translate "Domine programação" %}<br>
      {% translate "com" %} <span>{% translate "aprendizado prático" %}</span>
    </h1>

    <p class="hero-subtitle">
      {% translate "Dicas, tutoriais e soluções reais" %}<br>
      {% translate "para desenvolvedores." %}
    </p>

  </div>

</section>
