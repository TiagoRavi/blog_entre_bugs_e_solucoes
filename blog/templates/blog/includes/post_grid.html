<section class="container post-grid">
  {% for post in posts %}
    <article class="post-card">

      {% if post.featured_image %}
        <img
          src="{{ post.featured_image.url }}"
          alt="{{ post.title }}"
          class="post-image"
          loading="lazy"
        >
      {% else %}
        <div class="post-image" aria-hidden="true"></div>
      {% endif %}

      <div class="post-card-body">

        <div class="post-meta">
          <time datetime="{{ post.published_at|date:'Y-m-d' }}">
            {{ post.published_at|date:"d/m/Y" }}
          </time>
          ·
          {% if post.category %}
            <span class="post-category">
              {{ post.category.name|upper }}
            </span>
          {% endif %}
        </div>

        <h3 class="post-title">
          <a href="{% url 'blog:post_detail' post.slug %}">
            {{ post.title }}
          </a>
        </h3>

        <p class="post-excerpt">
          {{ post.excerpt|truncatechars:155 }}
        </p>

      </div>
    </article>
  {% endfor %}
</section>
