{% load i18n %}

{% if faqs %}
<section class="post-faq" aria-labelledby="faq-title">
    <h2 id="faq-title">{% trans "Perguntas frequentes" %}</h2>

    {% for faq in faqs %}
        <details class="faq-item">
            <summary class="faq-question">
                {{ faq.question }}
            </summary>

            <div class="faq-answer">
                {{ faq.answer|safe }}
            </div>
        </details>
    {% endfor %}
</section>
{% endif %}
