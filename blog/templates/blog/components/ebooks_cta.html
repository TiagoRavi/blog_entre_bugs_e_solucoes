
{% load i18n %}

<section
  class="home-ebooks-cta"
  aria-labelledby="home-ebooks-title"
>
  <div class="container">

    <div class="home-ebooks-cta-content">

      <span class="home-ebooks-eyebrow">
        {% translate "EBOOKS" %}
      </span>

      <h2 id="home-ebooks-title">
        {% translate "Aprenda programação com materiais premium" %}
      </h2>

      <p>
        {% blocktranslate %}
          Ebooks práticos sobre Python, Django e programação
          para você estudar no seu ritmo.
        {% endblocktranslate %}
      </p>

      <a
        href="{% url 'ebooks:index' %}"
        class="home-ebooks-cta-link"
      >
        {% translate "Ver ebooks gratuitos" %} →
      </a>

    </div>

  </div>
</section>
